[project]
name = "echo-backend"
version = "0.1.0"
description = "ECHO — external memory backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "openai>=1.55",
  "sarvamai>=0.1.20",
  "pyjwt[crypto]>=2.9",
  "numpy>=1.26,<3",
  "soundfile>=0.12.1",
  "soxr>=0.5",
  "sherpa-onnx>=1.10",
  "python-multipart>=0.0.12",
  "av==19.0.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real Supabase/Sarvam/Azure (opt-in with ECHO_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
